# Build IPQ50xx NSS firmware — thin caller (laipeng668-style).
#
# The build itself lives in build-ipq50xx-shared.yml (reusable workflow);
# this file only collects the dispatch inputs and passes them through,
# so adding a device later means adding a job here, not editing the build.
# Permissions (contents:write for release, actions:write for cache) are
# set on the calling job: a reusable workflow runs with its caller's
# permissions.
#
# NOTE: the menu shows hardware board versions (M79A / M81) because that
# is the distinction that matters — NOT the operator model numbers
# (8806/8808/8809 are carrier suffixes; a CR8808 exists as both M79A and
# M81). The menu values are translated here to the internal device names
# (xiaomi_cr8806 / xiaomi_cr8808) that the shared workflow expects, so
# the shared workflow itself is untouched by this rename.

name: Build IPQ50xx NSS firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: "按主板版本选，运营商型号（8806/8808/8809）不作数。all = M79A + M81 都编（同一次 run、同一个 HEAD，默认）；M79A = CR8806/CR8808/CR8809 A版 M79（IPQ5000 + 2.4G MXD7223）单编；M81 = CR8808 A版 M81 / 红米 AX3000（IPQ5000 + 2.4G CTR66266）单编。B版（CR881x，IPQ5018）不支持，别选。选错硬件会编错固件，务必对号入座。"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - M79A
          - M81
      firmware:
        description: "NSS firmware line. 12.5 is the default; 12.2 is the fallback. The driver is built for the firmware shipped, never mix them."
        required: true
        default: "12.5"
        type: choice
        options:
          - "12.5"
          - "12.2"
      base_ref:
        description: "kuncy7/openwrt-nss-edma commit to build. Default is the HEAD of c3po-tag-8021q as seen on the repo page on 2026-11-02; refresh it when rebasing."
        required: true
        default: "13e8bc914709c4794b3ec7b0421d2038386e697e"

jobs:
  build-cr8806:
    name: Build M79A (NSS FW ${{ inputs.firmware }})
    if: inputs.device == 'all' || inputs.device == 'M79A'
    uses: ./.github/workflows/build-ipq50xx-shared.yml
    with:
      device: xiaomi_cr8806
      firmware: ${{ inputs.firmware }}
      base_ref: ${{ inputs.base_ref }}
    permissions:
      contents: write
      actions: write
  build-cr8808:
    name: Build M81 (NSS FW ${{ inputs.firmware }})
    if: inputs.device == 'all' || inputs.device == 'M81'
    uses: ./.github/workflows/build-ipq50xx-shared.yml
    with:
      device: xiaomi_cr8808
      firmware: ${{ inputs.firmware }}
      base_ref: ${{ inputs.base_ref }}
    permissions:
      contents: write
      actions: write
