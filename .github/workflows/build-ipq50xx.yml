# Build IPQ50xx NSS firmware
#
# Builds OpenWrt firmware with Qualcomm NSS acceleration for IPQ50xx devices
# from the kuncy7/openwrt-nss-edma tree (branch c3po-tag-8021q, kernel 6.18).
#
# This repository holds the build scripts, configs, and device definitions
# the base tree does not have yet (dts/). The base tree is
# cloned at build time at a pinned commit (see base_ref). The nss feed comes
# from the base tree's feeds.conf.default (kuncy7/nss-packages, branch
# ipq50xx-rebase); pinning the feed by commit is a TODO, see below.
#
# On success, the workflow also publishes a GitHub Release with the
# firmware and buildinfo files (one release per run; a re-run gets a new
# tag because the run attempt is part of the tag).

name: Build IPQ50xx NSS firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device profile to build (must have a mapping in the 'Apply device config' step)"
        required: true
        default: "xiaomi_cr8806"
        type: choice
        options:
          - xiaomi_cr8806
          - xiaomi_cr8808
      firmware:
        description: "NSS firmware line. 12.5 is the default; 12.2 is the fallback. The driver is built for the firmware shipped, never mix them."
        required: true
        default: "12.5"
        type: choice
        options:
          - "12.5"
          - "12.2"
      base_ref:
        description: "kuncy7/openwrt-nss-edma commit to build. Default is the HEAD of c3po-tag-8021q as seen on the repo page on 2026-11-02; refresh it when rebasing."
        required: true
        default: "13e8bc914709c4794b3ec7b0421d2038386e697e"

# Release creation needs contents:write; the cache steps need actions:write
# for cache save and restore (an explicit permissions block otherwise
# leaves the actions scope at none and the cache calls fail).
permissions:
  contents: write
  actions: write

env:
  BASE_REPO: https://github.com/kuncy7/openwrt-nss-edma.git
  TZ: Asia/Shanghai
  # ccache tuning (kuncy7-style): content-based compiler check so a
  # compiler mtime change does not invalidate the cache, 4G cap.
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 4G

jobs:
  build:
    name: Build ${{ inputs.device }} (NSS FW ${{ inputs.firmware }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Serialize runs per device (upstream-style): two runs sharing the
    # cache and the release must never overlap, and a queued run must
    # wait rather than cancel the running build.
    concurrency:
      group: ipq50xx-${{ matrix.device }}
      cancel-in-progress: false
    strategy:
      # To add a device later: add its profile name here AND a mapping line in
      # the "Apply device config" step AND a config file in configs/.
      # If the base tree has no profile for it yet, also add its .dts and
      # .mk.inc to dts/ (the "Install custom devices" step injects them).
      matrix:
        device: ["${{ inputs.device }}"]
    steps:
      - name: Checkout scaffold repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      # Log baseline (upstream-style): CPU/mem/disk first, so a later
      # disk/memory failure can be read against the starting state.
      - name: Check server performance
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          echo "--- CPU ---"
          nproc
          grep -m1 "model name" /proc/cpuinfo
          echo "--- memory ---"
          free -h
          echo "--- disk ---"
          df -hT

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev

      # Free disk space (kuncy7-style): a full build with staging cache
      # needs ~26 GB; stock runners carry dotnet/android/ghc/CodeQL
      # images that eat it. Remove them before cloning.
      - name: Free disk space
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          command -v docker >/dev/null && docker image prune --all --force || true
          df -hT

      - name: Clone base tree at pinned commit
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          git init openwrt
          cd openwrt
          git remote add origin "$BASE_REPO"
          # Retry the fetch (upstream-style): a transient network flake
          # must not fail the whole run. Warn per attempt, back off.
          attempt=1
          until git fetch --depth 1 origin "${{ inputs.base_ref }}"; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::CLONE FAILED after 3 fetch attempts"
              exit 1
            fi
            echo "::warning::fetch attempt $attempt failed, retrying..."
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done
          git checkout FETCH_HEAD
          git log --oneline -1
          # Sanity: this must be the NSS tree, not plain OpenWrt.
          test -f README.ipq50xx.md

      - name: Disable mainland mirrors
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # Upstream (laipeng668) practice, adopted per user decision:
          # GitHub runners are outside mainland China, so mainland
          # mirrors are slow/unreachable. Remove them from the mirror
          # list so downloads go to upstream origins; origins are
          # untouched, so availability cannot drop. Verified against
          # the pinned tree: projectsmirrors.json carries mainland
          # entries (filter has effect); download.pl has no gitmirror
          # lines (that sed is a no-op here, kept for fidelity).
          mirror_file="scripts/projectsmirrors.json"
          jq '
          with_entries(
          .value |= map(select(
          test("^https?://(mirrors\\.tencent\\.com|mirrors\\.aliyun\\.com|mirrors\\.tuna\\.tsinghua\\.edu\\.cn|mirrors\\.ustc\\.edu\\.cn|mirror\\.iscas\\.ac\\.cn|mirror\\.nju\\.edu\\.cn)(/|$)")
          | not
          ))
          )
          ' "$mirror_file" > "$mirror_file.tmp"
          mv "$mirror_file.tmp" "$mirror_file"
          sed -i '/raw\.gitmirror\.com/d' scripts/download.pl

      - name: Install custom devices
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # Devices the base tree does not have yet (e.g. M81) live in
          # this repo's dts/: a .dts file plus a .mk.inc device block.
          # Inject them into the base tree before defconfig. The
          # Device/Default rule derives the DTS name as
          # SOC-lastword(device name), so xiaomi_cr8808 ->
          # ipq5018-cr8808.dts; the .dts filename must match that rule.
          if ls ../dts/*.dts >/dev/null 2>&1; then
            cp ../dts/*.dts target/linux/qualcommax/dts/
            for inc in ../dts/*.mk.inc; do
              cat "$inc" >> target/linux/qualcommax/image/ipq50xx.mk
            done
            for f in ../dts/*.dts; do
              test -f "target/linux/qualcommax/dts/$(basename "$f")" || { echo "::error::DTS COPY FAILED: $f"; exit 1; }
            done
          fi
          echo "=== CUSTOM DEVICES INJECTED ==="
          ls ../dts/ 2>/dev/null || echo "(no repo dts files)"
          # M81 board data: the M81 image has no ipq-wifi package, so
          # fetch its board-2.bin files at build time from hzyitc's
          # redmi_ax3000 board files (pinned commit + sha256 check, so
          # the build is reproducible). hzyitc's 2.4 GHz file carries
          # two entries: board-id 0x10 (M79, ipa) and 0x24 (M81, epa);
          # the M81 DTS sets qcom,board_id = 0x24, so ath11k picks the
          # M81 entry. The 5G file has the shared board-id 0x60 entry.
          # Fail here, before the long build, if the fetch or the hash
          # check fails, instead of shipping an image whose Wi-Fi loads
          # the wrong board data (or none).
          if [ "${{ inputs.device }}" = "xiaomi_cr8808" ]; then
            HZY_COMMIT="ab1f9ffa5b5b62f252a5e87eb23f51f4e2544511"
            HZY_BASE="https://raw.githubusercontent.com/hzyitc/openwrt-redmi-ax3000/$HZY_COMMIT/package/firmware/ipq-wifi"
            mkdir -p ../files-xiaomi_cr8808/lib/firmware/ath11k/IPQ5018/hw1.0 \
                     ../files-xiaomi_cr8808/lib/firmware/ath11k/QCN6122/hw1.0
            curl -sL -o ../files-xiaomi_cr8808/lib/firmware/ath11k/IPQ5018/hw1.0/board-2.bin \
              "$HZY_BASE/board-redmi_ax3000.ipq5018"
            curl -sL -o ../files-xiaomi_cr8808/lib/firmware/ath11k/QCN6122/hw1.0/board-2.bin \
              "$HZY_BASE/board-redmi_ax3000.qcn6122"
            echo "a1d03029566e469ceee4d570324dfa015f3d01e351bc87c81329ffdd7a7c4186  ../files-xiaomi_cr8808/lib/firmware/ath11k/IPQ5018/hw1.0/board-2.bin" | sha256sum -c -
            echo "91c689226aa5a3af853063452393055c5e764866fec707ccd504738314e75134  ../files-xiaomi_cr8808/lib/firmware/ath11k/QCN6122/hw1.0/board-2.bin" | sha256sum -c -
            echo "hzyitc/openwrt-redmi-ax3000 $HZY_COMMIT board-redmi_ax3000.ipq5018 board-redmi_ax3000.qcn6122" >> ../third-party-sources.txt
          fi

      - name: Patch cr8806 NAND ECC to 4-bit (trigsoft chain)
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # Build #6 diagnosis (2026-11-03): the kuncy7 base DTS forces
          # 8-bit NAND ECC, which is correct for a stock-U-Boot chain
          # but wrong for the trigsoft chain on this device: trigsoft's
          # modified U-Boot reads/writes NAND with 4-bit-compatible
          # ECC, so an 8-bit kernel cannot decode trigsoft-written
          # pages (UBI attach fails, no boot). HZYITC 5.4 (4-bit) and
          # ImmortalWrt (default = 4-bit) both boot via trigsoft web
          # flash; Build #6 (8-bit) was the only failure.
          # Build #8 (SMEM_PART.md §6.1): the cr8806 DTS is now a
          # repo-side override (dts/ipq5018-cr8806.dts) that the
          # "Install custom devices" step already copied over the base
          # DTS, so it already carries 4-bit AND fixed-partitions.
          # This step is therefore IDEMPOTENT: patch 8->4 only if an
          # 8-bit occurrence is still present (pure base-tree case),
          # then assert exactly one 4-bit and zero 8-bit. (The M81 DTS
          # is fixed repo-side in dts/ipq5018-cr8808.dts; this step
          # only affects cr8806.)
          DTS="target/linux/qualcommax/dts/ipq5018-cr8806.dts"
          test -f "$DTS" || { echo "::error:: $DTS not found"; exit 1; }
          if [ "$(grep -c 'nand-ecc-strength = <8>;' "$DTS" || true)" -ne 0 ]; then
            sed -i '/^&qpic_nand/,/^};/ s/nand-ecc-strength = <8>;/nand-ecc-strength = <4>;/' "$DTS"
          fi
          echo "--- after patch ---"
          grep -n 'nand-ecc-strength' "$DTS"
          if [ "$(grep -c 'nand-ecc-strength = <4>;' "$DTS" || true)" -ne 1 ]; then
            echo "::error:: expected exactly one 4-bit strength"
            exit 1
          fi
          if [ "$(grep -c 'nand-ecc-strength = <8>;' "$DTS" || true)" -ne 0 ]; then
            echo "::error:: 8-bit strength still present after patch"
            exit 1
          fi
          # Guard: the fixed-partitions override must have landed
          # (SMEM_PART.md §6.1). Fail closed if the DTS still uses
          # the SMEM-table parser node or lacks fixed-partitions.
          grep -q 'compatible = "fixed-partitions";' "$DTS" || { echo "::error:: fixed-partitions not found in $DTS (override did not land?)"; exit 1; }
          if grep -q 'qcom,smem-part' "$DTS"; then
            echo "::error:: qcom,smem-part still present in $DTS"
            exit 1
          fi

      - name: Pin feeds to proven commits
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # Reproducibility: the base tree's feeds.conf.default tracks
          # branches, and packages + luci moved between run #1 and run
          # #5. Copy the repo's pinned feeds.conf (run #5's exact feed
          # commits) so a rebuild pulls identical feed code.
          cp ../feeds.conf feeds.conf
          # Log precision: print exactly which feed commits are pinned,
          # so the log alone shows the feed state for this run.
          echo "=== PINNED FEEDS ==="
          grep -v '^#' feeds.conf | grep -v '^$'
          echo "=== PIN FEEDS OK ==="

      # Build cache (AX1800-style): ccache + staging_dir, so a rebuild
      # reuses the toolchain and already-built packages instead of
      # compiling everything from scratch. Unique key per run so a fresh
      # cache is always saved; the restore-keys prefix falls back to the
      # latest previous cache. Cache save happens in this step's
      # post-action; the Delete old caches step below removes older
      # entries first, so only the fresh entry survives. A cache save or
      # restore failure only warns and never fails the build.
      # Split caches (upstream-style): ccache, staging and dl each get
      # their own entry, keyed by device + customization content hash
      # (feeds.conf, configs, dts) + run id, with tiered restore keys
      # (exact customization -> base commit -> device). A customization
      # change still falls back to the previous cache, and make's stamp
      # checking rebuilds only what changed. Cache save happens in each
      # step's post-action; a save/restore failure only warns and never
      # fails the build.
      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          key: ipq50xx-${{ inputs.device }}-ccache-${{ hashFiles('feeds.conf', 'configs/**', 'dts/**') }}-${{ github.run_id }}
          restore-keys: |
            ipq50xx-${{ inputs.device }}-ccache-${{ hashFiles('feeds.conf', 'configs/**', 'dts/**') }}-
            ipq50xx-${{ inputs.device }}-ccache-${{ inputs.base_ref }}-
            ipq50xx-${{ inputs.device }}-ccache-
          path: |
            openwrt/.ccache

      - name: Restore staging cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          key: ipq50xx-${{ inputs.device }}-staging-${{ hashFiles('feeds.conf', 'configs/**', 'dts/**') }}-${{ github.run_id }}
          restore-keys: |
            ipq50xx-${{ inputs.device }}-staging-${{ hashFiles('feeds.conf', 'configs/**', 'dts/**') }}-
            ipq50xx-${{ inputs.device }}-staging-${{ inputs.base_ref }}-
            ipq50xx-${{ inputs.device }}-staging-
          path: |
            openwrt/staging_dir

      - name: Restore dl cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          key: ipq50xx-${{ inputs.device }}-dl-${{ hashFiles('feeds.conf', 'configs/**', 'dts/**') }}-${{ github.run_id }}
          restore-keys: |
            ipq50xx-${{ inputs.device }}-dl-${{ hashFiles('feeds.conf', 'configs/**', 'dts/**') }}-
            ipq50xx-${{ inputs.device }}-dl-${{ inputs.base_ref }}-
            ipq50xx-${{ inputs.device }}-dl-
          path: |
            openwrt/dl

      # Refresh the restored cache (AX1800-style, upstream-ordered):
      # restored stamp files carry old mtimes while freshly checked-out
      # sources are new, which would make make rebuild everything.
      # Host-tool stamps first, then the rest (except under target/):
      # aggregate stamps must come last or make rebuilds the toolchain
      # needlessly.
      - name: Refresh build cache
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          if [ -d openwrt/staging_dir ]; then
            find openwrt/staging_dir -type d -name "stamp" -path "*host*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
            done
            find openwrt/staging_dir -type d -name "stamp" -not -path "*target*" -not -path "*host*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
            done
            echo "=== CACHE REFRESH OK ==="
          else
            echo "(no staging_dir to refresh: cache miss or first run)"
          fi

      - name: Update and install feeds
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # feeds.conf.default of the base tree already names the nss feed
          # (kuncy7/nss-packages, branch ipq50xx-rebase).
          # TODO: pin the nss feed by commit. After a known-good build, copy
          # the nss line from feeds.buildinfo into a feeds.conf, commit it in
          # this repo, and copy it over feeds.conf.default here.
          # Log precision (IPQ6000-style): update one feed at a time, each
          # with its own marker, so a failure names the exact feed in the
          # log instead of dying inside a bulk update.
          for feed in packages luci routing telephony video nss; do
            echo "=== FEED UPDATE: $feed ==="
            ./scripts/feeds update "$feed" || { echo "::error::FEED FAILED at update: $feed"; exit 1; }
            echo "=== FEED UPDATE OK: $feed ==="
          done
          echo "=== FEED INSTALL: all ==="
          ./scripts/feeds install -a || { echo "::error::FEED FAILED at install (failing package above)"; exit 1; }
          # Per-feed identity in the log: name + exact commit, so the log
          # alone shows every feed's state for this run.
          for feed in packages luci routing telephony video nss; do
            echo "--- feed: $feed ---"
            git -C "feeds/$feed" log --oneline -1 2>/dev/null || echo "(feed dir not a git checkout: $feed)"
          done
          # Per-feed versions as one string (AX1800-style FEEDS_VERSION),
          # recorded for the release notes; fail if no feed revision was
          # found at all, so a silent feed failure cannot slip through.
          FEEDS_VERSION="$(for feed in packages luci routing telephony video nss; do
            if git -C "feeds/$feed" rev-parse --verify HEAD >/dev/null 2>&1; then
              printf '%s@%s;' "$feed" "$(git -C "feeds/$feed" rev-parse --short HEAD)"
            fi
          done)"
          if [ -z "$FEEDS_VERSION" ]; then
            echo "::error::No feed revisions found after updating feeds" >&2
            exit 1
          fi
          echo "FEEDS_VERSION=$FEEDS_VERSION" >> "$GITHUB_ENV"
          ./scripts/feeds list -r nss | grep -q qca-nss-drv && echo "nss feed OK"
          echo "=== FEEDS OK ==="

      - name: Fetch extra packages
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # Argon theme + config are not in the base feeds; track the
          # latest upstream master like the IPQ60xx project does.
          # Clone into package/, NOT feeds/: the build system picks up
          # package/ automatically, while ./scripts/feeds install only
          # works for packages registered in a feed index, so a manual
          # clone into feeds/ warns "No feed for package" and the
          # symbols get dropped by defconfig (this failed run #2).
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          echo "=== EXTRA PACKAGE: luci-theme-argon ==="
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon || { echo "::error::EXTRA PACKAGE FAILED: luci-theme-argon (clone)"; exit 1; }
          git -C package/luci-theme-argon log --oneline -1
          echo "ARGON_THEME_COMMIT=$(git -C package/luci-theme-argon rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "=== EXTRA PACKAGE: luci-app-argon-config ==="
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config || { echo "::error::EXTRA PACKAGE FAILED: luci-app-argon-config (clone)"; exit 1; }
          git -C package/luci-app-argon-config log --oneline -1
          echo "ARGON_CONFIG_COMMIT=$(git -C package/luci-app-argon-config rev-parse HEAD)" >> "$GITHUB_ENV"
          # Third-party-sources ledger (upstream-style): a file in
          # artifacts recording every extra source's repo + commit.
          # Appended (>>), never overwritten: the M81 board-data line
          # from the devices step must survive.
          {
            echo "luci-theme-argon master $(git -C package/luci-theme-argon rev-parse HEAD)"
            echo "luci-app-argon-config master $(git -C package/luci-app-argon-config rev-parse HEAD)"
          } >> ../third-party-sources.txt
          echo "=== EXTRA PACKAGES OK ==="

      - name: Apply device config
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # Map device profile -> config file in this repo.
          # Add one line per new device here.
          case "${{ matrix.device }}" in
            xiaomi_cr8806) CONFIG_FILE="cr8806-256m.config" ;;
            xiaomi_cr8808) CONFIG_FILE="cr8808-m81-256m.config" ;;
            *) echo "No config mapping for device: ${{ matrix.device }}" >&2; exit 1 ;;
          esac
          cp "../configs/${CONFIG_FILE}" .config
          # Firmware line selection. The driver is built for the firmware
          # shipped, so the two lines must never both be enabled.
          if [ "${{ inputs.firmware }}" = "12.2" ]; then
            sed -i 's/^CONFIG_NSS_FIRMWARE_VERSION_12_5=y/# CONFIG_NSS_FIRMWARE_VERSION_12_5 is not set/' .config
            echo 'CONFIG_NSS_FIRMWARE_VERSION_12_2=y' >> .config
          fi
          make defconfig
          # Fail fast if defconfig silently dropped a required symbol.
          # (A wrong symbol is dropped this way, which would otherwise
          # produce an image without the device or without NSS.)
          # Report EVERY missing symbol at once: a bare grep -q dies on
          # the first miss and never says which symbol failed, which is
          # how runs #2 and #3 stayed undiagnosed.
          fail=0
          for pat in \
            '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_${{ matrix.device }}=y$' \
            '^CONFIG_PACKAGE_nss-tools-dwmac=y$' \
            '^CONFIG_PACKAGE_nss-firmware=y$' \
            '^CONFIG_NSS_MEM_PROFILE_LOW=y$' \
            '^CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y$' \
            '^CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=y$' \
            '^CONFIG_DRIVER_11AC_SUPPORT=y$' \
            '^CONFIG_DRIVER_11AX_SUPPORT=y$' \
            '^CONFIG_PACKAGE_kmod-ath11k=y$' \
            '^CONFIG_PACKAGE_kmod-mac80211=y$' \
            '^CONFIG_PACKAGE_kmod-cfg80211=y$' \
            '^CONFIG_PACKAGE_kmod-ath=y$' \
            '^CONFIG_PACKAGE_wpad-basic-mbedtls=y$' \
            '^CONFIG_PACKAGE_iw=y$' \
            '^CONFIG_PACKAGE_iwinfo=y$' \
            '^CONFIG_PACKAGE_zram-swap=y$' \
            '^CONFIG_PACKAGE_kmod-lib-lz4=y$' \
            '^CONFIG_KERNEL_ZRAM_BACKEND_LZ4=y$' \
            '^CONFIG_KERNEL_ZRAM_BACKEND_LZO=y$' \
            '^CONFIG_KERNEL_ZRAM_DEF_COMP_LZ4=y$' \
            '^CONFIG_PACKAGE_kmod-tcp-bbr=y$' \
            '^CONFIG_CCACHE=y$' \
            '^CONFIG_USE_LTO=y$' \
            '^CONFIG_PACKAGE_kmod-nft-nat=y$' \
            '^CONFIG_PACKAGE_luci-theme-argon=y$' \
            '^CONFIG_PACKAGE_luci-app-argon-config=y$' \
            '^CONFIG_PACKAGE_htop=y$' \
            '^CONFIG_PACKAGE_zoneinfo-asia=y$' \
            '^CONFIG_PACKAGE_luci-app-upnp=y$' \
            '^CONFIG_PACKAGE_tcpdump-mini=y$' \
            '^CONFIG_PACKAGE_sqm-scripts-nss=y$' \
            '^CONFIG_PACKAGE_luci-app-sqm=y$' \
            '^CONFIG_PACKAGE_kmod-ifb=y$' \
            '^CONFIG_PACKAGE_ca-bundle=y$' \
            '^CONFIG_PACKAGE_adblock=y$' \
            '^CONFIG_PACKAGE_dnsmasq-full=y$' \
            ; do
            grep -q "$pat" .config || { echo "::error::MISSING: $pat"; fail=1; }
          done
          # O3 flags: confirm the custom CPU flags survived defconfig.
          grep -q 'mcpu=cortex-a53' .config || { echo "::error::MISSING: O3 mcpu flag"; fail=1; }
          # NSS bridge-mgr is ipq807x/ipq60xx-only (see config comment),
          # so it is deliberately NOT checked here.
          if [ "${{ inputs.firmware }}" = "12.5" ]; then
            grep -q '^CONFIG_NSS_FIRMWARE_VERSION_12_5=y$' .config || { echo "::error::MISSING: NSS_FIRMWARE_VERSION_12_5"; fail=1; }
          else
            grep -q '^CONFIG_NSS_FIRMWARE_VERSION_12_2=y$' .config || { echo "::error::MISSING: NSS_FIRMWARE_VERSION_12_2"; fail=1; }
          fi
          # Fragment survival (fanha99 pattern): every positive selection
          # in the applied config file must survive defconfig, else fail
          # here with the exact line. This catches ANY silent drop, not
          # just the wireless symbols listed above.
          while IFS= read -r line; do
            case "$line" in
              # The firmware-version lines are rewritten by the 12.2
              # branch above and covered by the dedicated version check,
              # so they are exempt here.
              *NSS_FIRMWARE_VERSION_*) ;;
              CONFIG_*=*) grep -qF "$line" .config || { echo "::error::FRAGMENT DROPPED: $line"; fail=1; } ;;
            esac
          done < "../configs/${CONFIG_FILE}"
          # Wireless gate status: print the exact symbols so that a drop
          # reports its gate in the log at this step instead of needing
          # guesswork afterwards (Build #9 shipped WiFi-less because the
          # guard only checked the firmware line).
          echo "--- wireless symbols after defconfig ---"
          for s in CONFIG_DRIVER_11AC_SUPPORT CONFIG_DRIVER_11AX_SUPPORT CONFIG_PACKAGE_kmod-ath11k CONFIG_PACKAGE_kmod-mac80211 CONFIG_PACKAGE_kmod-cfg80211 CONFIG_PACKAGE_kmod-ath CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122 CONFIG_PACKAGE_wpad-basic-mbedtls CONFIG_PACKAGE_iw CONFIG_PACKAGE_iwinfo; do
            grep -E "^#? ?${s}(=| is not set)" .config || echo "$s: absent"
          done
          [ "$fail" = 0 ] || exit 1
          echo "=== DEFCONFIG GUARD OK ==="
          # DEVICE_PACKAGES check (kuncy7-style, FAIL MODE): read the
          # targetinfo generated by defconfig and fail for every device
          # package of the enabled profile that is not selected in
          # .config. Promoted from warn mode after #13's clean run
          # validated the parser.
          python3 ../scripts/check-device-packages.py .config tmp/info/.targetinfo-qualcommax "${{ matrix.device }}"

      - name: Install files overlay
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # Anything in this repo's files/ is baked into the image rootfs.
          # uci-defaults and hotplug scripts must be executable in the
          # image, and the snapshot push stores them as 0644, so chmod
          # them here.
          if [ -d ../files ]; then
            mkdir -p files
            cp -r ../files/. files/
            chmod +x files/etc/uci-defaults/* 2>/dev/null || true
            chmod +x files/etc/hotplug.d/firmware/* 2>/dev/null || true
          fi
          # Per-device overlay (e.g. files-xiaomi_cr8808/): applied after
          # files/, so it can override shared files. M81 board data
          # lives here, not in files/, so the M79 image never picks it up.
          if [ -d "../files-${{ matrix.device }}" ]; then
            cp -r "../files-${{ matrix.device }}/." files/
          fi
          echo "=== FILES OVERLAY ==="
          find files -type f 2>/dev/null | head -50
          echo "overlay file count: $(find files -type f 2>/dev/null | wc -l)"

      - name: Download sources
        timeout-minutes: 90
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: 1000
          GIT_HTTP_LOW_SPEED_TIME: 60
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          echo "=== DOWNLOAD SOURCES ==="
          # Retry the download (kuncy7/yingjiedev-style): 3 attempts,
          # each capped by timeout, low-speed abort env, truncated
          # files removed AND printed between attempts so a bad
          # download can neither poison the build nor hide.
          attempt=1
          until timeout --kill-after=60 20m make download -j"$(nproc)"; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::DOWNLOAD FAILED after 3 attempts"
              exit 1
            fi
            echo "::warning::download attempt $attempt failed, retrying..."
            if [ -d dl ]; then
              echo "--- removing truncated downloads (<1024c) ---"
              find dl -size -1024c -print -exec rm -f {} \;
            fi
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done
          if [ -d dl ]; then
            echo "--- removing truncated downloads (<1024c) ---"
            find dl -size -1024c -print -exec rm -f {} \;
          fi
          echo "=== DOWNLOAD OK ==="

      - name: Build firmware
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          echo "=== BUILD START: $(date) (parallel) ==="
          make -j"$(nproc)" || {
            echo "=== BUILD: parallel make FAILED, retrying serial to pinpoint the failing package ==="
            make -j1 || {
              echo "=== BUILD: serial make FAILED, retrying serial verbose (V=s) ==="
              make -j1 V=s || { echo "::error::BUILD FAILED in serial verbose run (failing package above)"; exit 1; }
            }
          }
          echo "=== BUILD OK: $(date) ==="
          # ccache stats (kuncy7-style): hit rate for the next run's
          # cache diagnosis. Never fails the build.
          staging_dir/host/bin/ccache -s 2>/dev/null || ccache -s 2>/dev/null || echo "(ccache stats unavailable)"

      - name: Verify wireless stack built
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          # Fail fast with the exact missing piece instead of publishing
          # a WiFi-less release that only shows up on the router (Build #9).
          # NOTE: check the full .config here, NOT config.buildinfo: the
          # latter is a diffconfig (only non-default symbols), so default
          # packages like kmod-ath11k never appear in it even when built.
          fail=0
          for pat in \
            '^CONFIG_PACKAGE_kmod-ath11k=y$' \
            '^CONFIG_PACKAGE_kmod-mac80211=y$' \
            '^CONFIG_PACKAGE_kmod-cfg80211=y$' \
            '^CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=y$' \
            '^CONFIG_PACKAGE_wpad-basic-mbedtls=y$' \
            '^CONFIG_PACKAGE_iw=y$' \
            ; do
            grep -q "$pat" .config || { echo "::error::BUILT CONFIG MISSING: $pat"; fail=1; }
          done
          # Package-format check: this tree builds APK packages
          # (kmod-ath11k-6.18.55.7.2-r10.apk), NOT ipk. #11 and #12
          # failed here because the check looked for '*.ipk' while the
          # build had already produced the .apk (proven by #12's own
          # evidence dump). Accept any kmod-ath11k file under bin/,
          # whatever the extension. The old CONFIG_ATH11K built-in
          # branch is removed: CONFIG_ATH11K is a kernel symbol that
          # never appears in .config, so that branch could never match.
          if find bin -name 'kmod-ath11k*' | grep -q .; then
            echo "kmod-ath11k package found:"
            find bin -name 'kmod-ath11k*' | head -20
          else
            echo "--- bin/targets/qualcommax/ipq50xx/ ---"
            ls bin/targets/qualcommax/ipq50xx/ | head -40
            echo "--- packages dir ---"
            ls bin/targets/qualcommax/ipq50xx/packages/ 2>/dev/null | grep -i ath11k || echo "(no ath11k package in packages dir)"
            echo "::error::MISSING: no kmod-ath11k package built"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "=== VERIFY OK ==="

      # Post-build image verification (yingjiedev-style, adapted): parse
      # factory.ubi and verify its structure against the merged layout
      # (PEB alignment, size limit, kernel+rootfs volumes present with
      # data) before it ever reaches artifacts or a release. This moves
      # pre-flash binary analysis into CI. The verifier was validated
      # locally against our #8/#9 images (pass) and corrupted copies
      # (fail); it deliberately does not gate on header CRCs (observed
      # to mismatch on known-good images) or exact LEB counts (kernel
      # size legitimately varies).
      - name: Verify factory image structure
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          cd openwrt
          FACTORY="$(ls bin/targets/qualcommax/ipq50xx/*"${{ matrix.device }}"*factory.ubi 2>/dev/null | head -1 || true)"
          test -n "$FACTORY" || { echo "::error::FACTORY IMAGE MISSING"; exit 1; }
          echo "=== VERIFY FACTORY IMAGE: $FACTORY ==="
          python3 ../scripts/verify-factory-ubi.py "$FACTORY"
          echo "=== FACTORY IMAGE OK ==="

      - name: Stage artifacts
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          mkdir -p artifacts
          cd openwrt
          cp bin/targets/qualcommax/ipq50xx/*"${{ matrix.device }}"*sysupgrade.bin ../artifacts/ 2>/dev/null || true
          cp bin/targets/qualcommax/ipq50xx/*"${{ matrix.device }}"*initramfs* ../artifacts/ 2>/dev/null || true
          cp bin/targets/qualcommax/ipq50xx/*"${{ matrix.device }}"*factory.ubi ../artifacts/ 2>/dev/null || true
          cp bin/targets/qualcommax/ipq50xx/config.buildinfo ../artifacts/ 2>/dev/null || true
          cp bin/targets/qualcommax/ipq50xx/feeds.buildinfo ../artifacts/ 2>/dev/null || true
          # Stage the full resolved .config (upstream-style): the
          # buildinfo files show deltas only; the resolved config is
          # what actually built, and it is the diagnostic record.
          cp .config ../artifacts/"${{ matrix.device }}.config" 2>/dev/null || echo "(no .config to stage)"
          cp ../third-party-sources.txt ../artifacts/ 2>/dev/null || echo "(no third-party-sources ledger)"
          # The sysupgrade image and the factory image are mandatory;
          # fail loudly without them so a release is never incomplete.
          ls ../artifacts/*sysupgrade.bin
          ls ../artifacts/*factory.ubi
          cd ../artifacts && sha256sum * > sha256sums.txt
          ls -l ../artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: ipq50xx-${{ matrix.device }}-nss-fw${{ inputs.firmware }}
          path: artifacts/
          if-no-files-found: error
          # Images are already compressed; recompressing them wastes
          # time (upstream-style).
          compression-level: 0

      # One-glance run review (kuncy7-style): images + feed versions in
      # the run summary, not buried in the log.
      - name: Build summary
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          {
            echo "### IPQ50xx NSS build"
            echo ""
            echo "- Device: ${{ matrix.device }}, NSS firmware: ${{ inputs.firmware }}"
            echo "- Images:"
            ls -l artifacts/ | tail -n +2 | awk '{print "  - " $9 " (" $5 " bytes)"}'
            echo "- Feed versions: ${{ env.FEEDS_VERSION }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set release tag
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          DATE="$(date +'%Y.%m.%d')"
          echo "RELEASE_TAG=${{ matrix.device }}-${DATE}-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${{ matrix.device }} NSS FW ${{ inputs.firmware }} - ${DATE} (Build #${{ github.run_number }}, attempt ${{ github.run_attempt }})" >> "$GITHUB_ENV"
          # Supported models per firmware profile, so every release
          # states which hardware it may be flashed on. ALT models
          # (same profile, same DTS) count as supported for install,
          # on-device testing is tracked separately in the README.
          case "${{ matrix.device }}" in
            xiaomi_cr8806) SUPPORTED_MODELS="Xiaomi CR8806 (A版 M79), Xiaomi CR8808 (A版 M79), Xiaomi CR8809 (A版 M79)" ;;
            xiaomi_cr8808) SUPPORTED_MODELS="Xiaomi CR8808 (A版 M81)" ;;
            *) SUPPORTED_MODELS="${{ matrix.device }}" ;;
          esac
          echo "SUPPORTED_MODELS=$SUPPORTED_MODELS" >> "$GITHUB_ENV"

      - name: Publish release
        if: success()
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          artifacts: "artifacts/*"
          allowUpdates: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            IPQ50xx NSS firmware build (kernel 6.18, NSS firmware ${{ inputs.firmware }}).

            - Device profile: ${{ matrix.device }}
            - Supported models: ${{ env.SUPPORTED_MODELS }}
            - Base tree: kuncy7/openwrt-nss-edma, branch c3po-tag-8021q, commit ${{ inputs.base_ref }}
            - Feed versions: ${{ env.FEEDS_VERSION }}
            - Argon theme: jerrykuku/luci-theme-argon (${{ env.ARGON_THEME_COMMIT }})
            - Argon config: jerrykuku/luci-app-argon-config (${{ env.ARGON_CONFIG_COMMIT }})
            - Build: #${{ github.run_number }}, attempt ${{ github.run_attempt }}

            Attached files: sysupgrade image, factory image, initramfs image (if built), config.buildinfo, feeds.buildinfo, sha256sums.txt.

            First install: UART + TFTP, boot the initramfs image, then write factory.ubi from the booted system to the other slot; later upgrades use sysupgrade.

            WARNING: factory.ubi is an OpenWrt UBI image for the firmware UBI partition, not OEM firmware. Install it only from a booted OpenWrt initramfs system to that partition (first-install path above). Flashing it to any other partition — including through a bootloader web recovery pointed at the wrong target — bricks the device (confirmed 2026-11-03). Do not sysupgrade to this firmware from a system with a different partition layout (e.g. a merged single-UBI layout); use the first-install path above.

            Flash only the listed models. Do not flash across models, board revisions (M79/M81) or A/B versions; a wrong image can brick the device.

      # Post-upload digest verification (yingjiedev-style): download
      # the just-published assets and compare against the staged
      # sha256sums.txt. A mismatch fails the job (alerting). It cannot
      # unpublish, so this is detection, not prevention — draft-first
      # publishing (kmod-repo feature) would close that gap.
      - name: Verify release digests
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "ERROR: command failed at line %s (exit %s): %s\n" "$LINENO" "$status" "$BASH_COMMAND" >&2; exit "$status"' ERR
          attempt=1
          until gh release download "$RELEASE_TAG" --dir /tmp/release-verify --pattern '*' 2>/dev/null; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::RELEASE DOWNLOAD FAILED after 3 attempts"
              exit 1
            fi
            echo "::warning::release download attempt $attempt failed, retrying..."
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done
          cd /tmp/release-verify
          sha256sum -c sha256sums.txt || { echo "::error::RELEASE DIGEST MISMATCH"; exit 1; }
          echo "=== RELEASE DIGESTS OK ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cleanup runs only when the build succeeded, and never fails the
      # job: the release above is already published by then, and the user
      # only needs the release to stay normal. Cache save happens in the
      # cache steps' post-actions, after these steps, so the fresh cache
      # survives while older entries are deleted.
      # Keep-newest cleanup (upstream-style, adapted to a single job):
      # per cache type, keep the newest entry (the previous run's cache,
      # a useful fallback) and delete the rest. Runs are serialized by
      # the concurrency group, so no live cache can be clobbered here.
      - name: Delete old caches
        continue-on-error: true
        run: |
          for prefix in "ipq50xx-${{ inputs.device }}-ccache-" "ipq50xx-${{ inputs.device }}-staging-" "ipq50xx-${{ inputs.device }}-dl-"; do
            gh cache list --key "$prefix" --json key,createdAt --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].key' 2>/dev/null | while read -r key; do
              [ -n "$key" ] && gh cache delete "$key" || true
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c  # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 2
          keep_minimum_runs: 0

      # Log-only failure diagnosis (IPQ6000-style): when any step fails,
      # this step prints the exact build state into the log, so the log
      # alone is enough to name the failure point. It never fails itself
      # (set +e), and it runs even though earlier steps failed.
      - name: Diagnose failure
        if: failure()
        run: |
          set +e
          echo "===== FAILURE DIAGNOSTICS ====="
          echo "--- scaffold HEAD ---"
          git log --oneline -1 2>/dev/null || echo "(scaffold git unavailable)"
          if [ -d openwrt ]; then
            cd openwrt
            echo "--- base HEAD ---"
            git log --oneline -1 2>/dev/null || echo "(base git unavailable)"
            echo "--- wireless/NSS config ---"
            grep -E '^CONFIG_(PACKAGE_kmod-ath11k|PACKAGE_kmod-mac80211|PACKAGE_kmod-cfg80211|PACKAGE_ath11k-firmware|ATH11K|NSS_MEM_PROFILE|NSS_FIRMWARE_VERSION)' .config 2>/dev/null || echo "(no .config)"
            echo "--- target dir ---"
            ls bin/targets/qualcommax/ipq50xx/ 2>/dev/null | head -40 || echo "(no target dir)"
            echo "--- kmod-ath11k files under bin/ ---"
            find bin -name 'kmod-ath11k*' 2>/dev/null | head -20 || echo "(none)"
            echo "--- disk ---"
            df -h . 2>/dev/null | tail -1 || true
          else
            echo "(openwrt dir missing: failure was before clone)"
          fi
          echo "===== END DIAGNOSTICS ====="
