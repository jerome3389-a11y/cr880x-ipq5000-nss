# Build IPQ50xx NSS firmware — thin caller (laipeng668-style).
#
# The build itself lives in build-ipq50xx-shared.yml (reusable workflow);
# this file only collects the dispatch inputs and passes them through,
# so adding a device later means adding a job here, not editing the build.
# Permissions (contents:write for release, actions:write for cache) are
# set on the calling job: a reusable workflow runs with its caller's
# permissions.

name: Build IPQ50xx NSS firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: "all = 全部编译 (M79A + M81, 同一次 run, 同一个 HEAD, 默认); xiaomi_cr8806 = M79A (CR8806/8808/8809 A版 M79) 单编; xiaomi_cr8808 = M81 (CR8808 A版 M81) 单编. Must have a mapping in the 'Apply device config' step; 选错硬件会编错固件，务必对号入座。"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - xiaomi_cr8806
          - xiaomi_cr8808
      firmware:
        description: "NSS firmware line. 12.5 is the default; 12.2 is the fallback. The driver is built for the firmware shipped, never mix them."
        required: true
        default: "12.5"
        type: choice
        options:
          - "12.5"
          - "12.2"
      base_ref:
        description: "kuncy7/openwrt-nss-edma commit to build. Default is the HEAD of c3po-tag-8021q as seen on the repo page on 2026-11-02; refresh it when rebasing."
        required: true
        default: "13e8bc914709c4794b3ec7b0421d2038386e697e"

jobs:
  build-cr8806:
    name: Build xiaomi_cr8806 (NSS FW ${{ inputs.firmware }})
    if: inputs.device == 'all' || inputs.device == 'xiaomi_cr8806'
    uses: ./.github/workflows/build-ipq50xx-shared.yml
    with:
      device: xiaomi_cr8806
      firmware: ${{ inputs.firmware }}
      base_ref: ${{ inputs.base_ref }}
    permissions:
      contents: write
      actions: write
  build-cr8808:
    name: Build xiaomi_cr8808 (NSS FW ${{ inputs.firmware }})
    if: inputs.device == 'all' || inputs.device == 'xiaomi_cr8808'
    uses: ./.github/workflows/build-ipq50xx-shared.yml
    with:
      device: xiaomi_cr8808
      firmware: ${{ inputs.firmware }}
      base_ref: ${{ inputs.base_ref }}
    permissions:
      contents: write
      actions: write
